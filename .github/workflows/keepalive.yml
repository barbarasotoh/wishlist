# Supabase (plan gratis) pausa el proyecto tras 7 días sin actividad.
# Esto hace una consulta cada 3 días para que nunca se pause.
# Además, si el repo lleva 30+ días sin cambios, hace un commit vacío,
# porque GitHub apaga las tareas programadas de repos inactivos por 60 días.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zwghcvcpxoavqscldngp.supabase.co/rest/v1/items?select=id&limit=1" \
            -H "apikey: sb_publishable_ES1bhE1AOUp5V-XYSs3aWA_OTctTySW")
          echo "Respuesta: $code"
          [ "$code" != "000" ] && [ "$code" -lt 500 ]

      - uses: actions/checkout@v4

      - name: Mantener el repo activo
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activo"
            git push
          fi
